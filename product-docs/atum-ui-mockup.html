<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atum · Prototype</title>
<style>
@font-face { font-family: 'Brave Sans'; src: url('assets/fonts/BraveSansWeb-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Brave Sans'; src: url('assets/fonts/BraveSansWeb-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Brave Sans'; src: url('assets/fonts/BraveSansWeb-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

:root {
  --absa-passion: #DC0037;
  --absa-power:   #B50232;
  --absa-hope:    #95052A;
  --absa-inspire: #77021E;
  --absa-energy:  #FF780F;
  --absa-enrich:  #131010;
  --absa-serene:  #FFFFFF;

  --bg: #faf8f8;
  --surface: #ffffff;
  --surface-subtle: #f5f2f2;
  --border: #e6e2e2;
  --border-strong: #cdc7c7;
  --text: var(--absa-enrich);
  --text-secondary: #453f3f;
  --text-muted: #767676;
  --sidebar-bg: #1c1515;
  --sidebar-hover: #2d2222;
  --primary: var(--absa-power);
  --primary-hover: var(--absa-passion);
  --primary-active: var(--absa-inspire);
  --primary-bg: #fcebee;
  --success: #1e7a42;
  --warn: #c2410c;
  --warn-bg: #fff3e9;
  --warn-border: var(--absa-energy);
  --crit-bg: #fdecee;

  /* status tones: always paired with an icon + label */
  --tone-good: #1e7a42;
  --tone-critical: #c62b3b;
  --tone-serious: #c2410c;
  --tone-info: #6f6464;
  --tone-gap: #9a8f8f;
  --tone-neutral: #e9e3e3;

  --mono: "SF Mono", "JetBrains Mono", "Ubuntu Sans Mono", Menlo, Consolas, monospace;
  --sans: "Brave Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; font: 400 13px/1.45 var(--sans); background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
a { color: var(--primary); }

/* ── Prototype control bar (not part of the product) ── */
.proto-bar { display: flex; align-items: center; gap: 18px; padding: 7px 16px; background: #2b2b2b; color: #e8e8e8; font-size: 12px; position: sticky; top: 0; z-index: 40; flex-wrap: wrap; }
.proto-tag { font-weight: 700; letter-spacing: .4px; text-transform: uppercase; font-size: 10.5px; color: #ffb37a; border: 1px solid #6b4a33; padding: 2px 7px; border-radius: 4px; }
.proto-group { display: flex; align-items: center; gap: 8px; }
.proto-group > span { color: #b9b9b9; }
.proto-note { color: #b9b9b9; margin-left: auto; }

.pill-group { display: inline-flex; background: var(--surface-subtle); border: 1px solid var(--border); padding: 2px; border-radius: 6px; gap: 2px; flex-wrap: wrap; }
.pill-btn { border: 0; background: transparent; padding: 3px 10px; border-radius: 4px; font-size: 12px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
.pill-btn:hover { color: var(--text); }
.pill-btn.active { background: #fff; color: var(--primary); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.pill-group.dark { background: #1d1d1d; border-color: #444; }
.pill-group.dark .pill-btn { color: #cfcfcf; }
.pill-group.dark .pill-btn.active { background: #fff; color: var(--primary); }

/* ── Shell ── */
.shell { display: flex; min-height: calc(100vh - 38px); }
.sidebar { width: 212px; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; flex: none; }
.brand { height: 78px; min-height: 78px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: var(--absa-inspire); cursor: pointer; color: #fff; text-decoration: none; }
.brand img { height: 58px; min-height: 58px; width: 58px; display: block; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-weight: 700; font-size: 13.5px; line-height: 1.15; }
.brand-sub { font-size: 10.5px; color: rgba(255,255,255,.72); line-height: 1.25; margin-top: 2px; }
.side-nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 3px; }
.side-link { width: 100%; border: 0; background: transparent; color: #d9c9c9; padding: 8px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 9px; text-align: left; }
.side-link svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.side-link:hover { background: var(--sidebar-hover); color: #fff; }
.side-link.active { background: var(--sidebar-hover); color: #fff; font-weight: 700; box-shadow: inset 3px 0 0 var(--absa-energy); }
.side-count { margin-left: auto; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: rgba(255,255,255,.14); color: #f1e9e9; font-weight: 600; }
.side-footer { margin-top: auto; padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: #8f8484; line-height: 1.5; }

.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 14px; }
.crumbs { font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; min-width: 0; }
.crumbs a { color: var(--text-muted); text-decoration: none; cursor: pointer; }
.crumbs a:hover { color: var(--primary); }
.crumbs strong { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.control-pill { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 0 10px; height: 32px; font-size: 12.5px; }
.control-pill span { color: var(--text-muted); }
.control-pill select { border: 0; background: transparent; color: var(--text); font-weight: 600; outline: none; cursor: pointer; }
.btn { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--border-strong); background: #fff; color: var(--text); font-weight: 600; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-subtle); }
.btn-sm { height: 26px; padding: 0 9px; font-size: 12px; font-weight: 500; }

.container { padding: 14px 20px 28px; max-width: 1400px; width: 100%; }

/* ── Cards, KPIs ── */
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
.kpi-grid.k3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
.kpi-card.clickable { cursor: pointer; }
.kpi-card.clickable:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(181,2,50,.1); }
.kpi-card.attn { border-left: 3px solid var(--warn-border); }
.kpi-card.kpi-active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
.kpi-pillar { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); }
.kpi-label { font-size: 12px; color: var(--text-muted); }
.kpi-label .hint { border-bottom: 1px dotted var(--text-muted); cursor: help; }
.kpi-val { font-size: 20px; font-weight: 600; margin: 2px 0 1px; }
.kpi-val.warn { color: var(--warn); }
.kpi-sub { font-size: 12px; color: var(--text-muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 1px 2px rgba(19,16,16,.04); overflow: hidden; margin-bottom: 12px; }
.card-toolbar { padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fdfbfb; flex-wrap: wrap; }
.card-title { font-weight: 600; font-size: 13.5px; }
.toolbar-meta { font-size: 12px; color: var(--text-muted); }
.card-body { padding: 12px 16px; }
.two-col { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap: 12px; }
@media (max-width: 1150px) { .two-col { grid-template-columns: 1fr; } .kpi-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ── Filter bar & structured partitioning search ── */
.filter-bar { padding: 10px 16px; background: #fdfbfb; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search-input { flex: 1 1 240px; max-width: 340px; display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border-strong); border-radius: 6px; padding: 0 10px; height: 32px; }
.search-input input { border: 0; outline: none; width: 100%; font-size: 12.5px; background: transparent; }
.search-input.has-error { border-color: var(--tone-critical); background: #fffafb; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; }
.result-count { margin-left: auto; font-size: 12px; color: var(--text-muted); }

.search-panel { padding: 12px 16px; background: #fdfbfb; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.search-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search-fields { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.author-ctrl { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--border-strong); border-radius: 6px; padding: 0 8px; height: 32px; font-size: 12.5px; }
.author-ctrl span { color: var(--text-muted); font-size: 12px; }
.author-ctrl input { border: 0; outline: none; background: transparent; width: 145px; font-size: 12.5px; color: var(--text); }
.keys-box { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.keys-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
.key-clauses { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.key-clause { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-subtle); border: 1px solid var(--border-strong); border-radius: 6px; padding: 3px 6px; font-size: 12px; }
.key-clause input, .key-clause select { border: 1px solid var(--border); background: #fff; border-radius: 4px; height: 24px; padding: 0 6px; font-size: 12px; color: var(--text); }
.key-clause input.k-name { width: 120px; font-family: var(--mono); font-weight: 600; }
.key-clause input.k-val { width: 185px; font-family: var(--mono); }
.key-clause .k-any { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); padding: 0 8px; height: 24px; display: inline-flex; align-items: center; background: #faf8f8; border: 1px dashed var(--border-strong); border-radius: 4px; }
.tiny-btn { border: 1px solid var(--border-strong); background: #fff; color: var(--text-secondary); border-radius: 4px; height: 22px; padding: 0 6px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
.tiny-btn:hover { border-color: var(--primary); color: var(--primary); }
.tiny-btn:disabled { opacity: .45; cursor: not-allowed; }
.preset-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); }
.preset-chip { border: 1px solid var(--border-strong); background: #fff; color: var(--text-secondary); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; cursor: pointer; }
.preset-chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
.kv-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.kv-badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11px; background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; color: var(--text-secondary); max-width: 100%; }
.kv-badge.matched { background: var(--primary-bg); border-color: #e4a3b1; color: var(--absa-inspire); }
.kv-badge .kv-idx { font-family: var(--sans); font-size: 10px; font-weight: 700; color: var(--text-muted); }
.kv-badge button.kv-act { border: 0; background: transparent; padding: 0 2px; cursor: pointer; color: var(--text-muted); font-size: 11px; line-height: 1; }
.kv-badge button.kv-act:hover { color: var(--primary); }
.api-preview { padding: 8px 12px; background: #1c1515; color: #f4eeee; border-radius: 6px; font-family: var(--mono); font-size: 11.5px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.api-preview code { word-break: break-all; flex: 1; min-width: 240px; }
.api-preview .api-decoded { color: #d9c9c9; font-size: 11px; width: 100%; }
.inline-hint { padding: 7px 12px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: #fff; color: var(--text-secondary); }
.inline-hint.warn { background: var(--warn-bg); border-color: #f3c499; color: #7a3200; }
.inline-hint.err { background: var(--crit-bg); border-color: #e7a9b7; color: #8f1424; }
.pill-btn:disabled { opacity: .45; cursor: not-allowed; }

/* ── Tables ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
th { background: #faf8f8; color: var(--text-muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
tr.row-link { cursor: pointer; transition: background .1s; }
tr.row-link:hover td { background: #faf8f8; }
tr.row-link:hover .row-chevron { color: var(--primary); transform: translateX(2px); }
tr.row-selected td { background: var(--primary-bg); }
tr.row-shift { box-shadow: inset 3px 0 0 var(--warn-border); }
tr.group-row td { background: #f7f3f3; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); padding: 5px 12px; }
tr.detail-row > td { background: #fcfafa; padding: 0; }
.row-chevron { color: var(--text-muted); font-weight: 600; display: inline-block; transition: transform .12s, color .12s; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono-id { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.ds-name { font-weight: 600; color: var(--text); }
.cell-changed { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.delta-sub { display: block; font-size: 11px; font-weight: 400; color: var(--warn); line-height: 1.15; }
.strike { text-decoration: line-through; color: var(--text-muted); }

/* ── Status & producer indicators (from the Atum mockup) ── */
.badge-shift { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); white-space: nowrap; }
.badge-crit { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--crit-bg); color: #8f1424; border: 1px solid #e7a9b7; white-space: nowrap; }
.status-consistent, .status-plain { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }
.status-consistent svg { color: var(--success); flex: none; }
.prod-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-subtle); border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
.chip.weak { border-color: #e9c9a8; background: var(--warn-bg); color: #7a3200; }
.chip.ext { border-style: dashed; }
.link-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border-strong); background: #fff; color: var(--text-secondary); cursor: pointer; }
.link-chip:hover { border-color: var(--primary); color: var(--primary); }
.link-chip svg { width: 12px; height: 12px; }

/* ── Status grid (Combined overview) ── */
.status-grid td.cell-td { padding: 3px 3px; text-align: center; }
.status-grid th.day-th { text-align: center; font-weight: 600; padding: 6px 3px; font-size: 11px; }
.status-grid th.day-th .today { display: block; font-size: 10px; font-weight: 400; color: var(--text-muted); }
.cell { border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 24px; }
.compact .cell { width: 22px; height: 20px; }
.cell:hover { box-shadow: 0 0 0 2px var(--text-secondary); }
.glyph-bg-good { fill: var(--tone-good); } .glyph-bg-critical { fill: var(--tone-critical); } .glyph-bg-serious { fill: var(--tone-serious); }
.glyph-bg-info { fill: var(--tone-info); } .glyph-bg-neutral { fill: var(--tone-neutral); } .glyph-bg-gap { fill: #fff; stroke: var(--tone-gap); stroke-width: 1.4; stroke-dasharray: 2.2 1.6; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.callout { padding: 7px 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.callout-warn { background: var(--warn-bg); color: #7a3200; }
.callout-crit { background: var(--crit-bg); color: #6d0f1b; }
.callout-ok { background: #faf8f8; color: var(--text-secondary); }
.empty { padding: 22px 16px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
.empty strong { display: block; color: var(--text-secondary); margin-bottom: 4px; font-size: 13px; }
.scope-list { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.scope-list li { padding: 5px 0 5px 22px; position: relative; color: var(--text-secondary); border-bottom: 1px solid #f1eded; }
.scope-list li:last-child { border-bottom: 0; }
.scope-list li svg { position: absolute; left: 0; top: 7px; }
.sec-heading { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 0 0 6px; }

/* ── Lineage & inspector (from the Atum mockup) ── */
.lineage-canvas { background: radial-gradient(#dcd7d7 1px, transparent 1px) 0 0 / 18px 18px #fdfbfb; padding: 8px 12px; overflow-x: auto; }
.node-group { cursor: pointer; transition: opacity .15s; }
.node-group:hover .node-box { stroke: var(--primary); }
.inspector-head { padding: 10px 16px 0; background: #fdfbfb; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.inspector-title { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; flex-wrap: wrap; }
.inspector-title h2 { font-size: 15px; font-weight: 600; margin: 0; }
.subtabs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.subtab { border: 0; background: transparent; padding: 7px 12px 9px; font-size: 12.5px; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.subtab:hover { color: var(--text); }
.subtab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.meta-top { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fdfbfb; }
.meta-card { background: #fff; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.meta-card-head { padding: 7px 12px; background: #faf8f8; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.meta-card table th, .meta-card table td { padding: 6px 12px; font-size: 12px; }
.meta-card table tr:last-child td { border-bottom: 0; }
.key-idx { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 4px; background: var(--surface-subtle); border: 1px solid var(--border); font-size: 10.5px; font-weight: 600; color: var(--text-muted); margin-right: 6px; }
.prop-chip { display: inline-block; font-family: var(--mono); font-size: 11px; background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; margin-right: 4px; color: var(--text-secondary); }
.copy-btn { border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 0 5px; font-size: 10.5px; color: var(--text-muted); cursor: pointer; margin-left: 5px; }
.copy-btn:hover { color: var(--primary); border-color: var(--primary); }
.links-row { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-muted); }
.chart-wrap { padding: 8px 12px 4px; }
.hov .xh { opacity: 0; }
.hov:hover .xh { opacity: 1; }
.chart-wrap svg text, .lineage-canvas svg text { font-family: var(--sans); }
.run-detail { padding: 12px 16px 14px; border-left: 3px solid var(--primary); }
.run-detail .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

/* ── Page header, filter bar, KPI icons (from the Run Activity Monitor) ── */
.page-head { display: flex; align-items: center; gap: 14px; margin: 2px 0 14px; }

      <div class="meta-card"><div class="meta-card-head"><span>Partitioning Metadata</span><span style="font-weight:400;color:var(--text-muted)">${ds.ad.length} registered</span></div>
        <table><thead><tr><th>Key</th><th>Value</th><th style="text-align:right">Author</th></tr></thead><tbody>${ds.ad.length ? ds.ad.map(([k, v]) => `<tr><td style="width:140px;color:var(--text-secondary);font-weight:600">${esc(k)}</td><td style="font-family:var(--mono)">${esc(v)}</td><td style="color:var(--text-muted);text-align:right">${esc(ds.author)}</td></tr>`).join("") : `<tr><td colspan="3" style="color:var(--text-muted);text-align:center;padding:14px">No partitioning metadata registered</td></tr>`}</tbody></table></div></div>
      ${cps.length ? `<div class="table-wrap"><table><thead><tr><th>Checkpoint</th><th>Checkpoint UUID</th><th>Process start</th><th>Process end</th><th>Capture method</th><th>Checkpoint properties</th></tr></thead><tbody>
      ${cps.map((c, i) => `<tr><td style="font-weight:600;white-space:nowrap">${i + 1}. ${esc(c.name)}</td><td style="white-space:nowrap"><span class="mono-id" title="${esc(c.id)}">${esc(fmtShortUuid(c.id))}</span><button class="copy-btn" data-go="copy:${c.id}">Copy</button></td>
        <td style="white-space:nowrap">${r.static ? r.day : d} ${hms(c.t)} UTC</td><td style="white-space:nowrap">${r.static ? r.day : d} ${hms(c.t + c.len)} UTC</td><td style="white-space:nowrap">${c.agent ? "Atum Agent" : "External API"}</td>
        <td>${Object.entries(c.props || {}).map(([k, v]) => `<span class="prop-chip">${esc(k)}=<b>${esc(v)}</b></span>`).join("") || "—"}</td></tr>`).join("")}
      </tbody></table></div>` : ""}`;
  },
  history(ds, d) {
    const comb = STATE.edition === "combined";
    const hist = ds.static ? [{ d: null, r: STATIC_ISO }] : DAYS.filter(x => REC[ds.key][x].atum && inWin(x, lastCp(REC[ds.key][x], false).t)).map(x => ({ d: x, r: REC[ds.key][x] }));
    if (!hist.length) return `<div class="empty"><strong>No ${TERM.many} in this window</strong>Widen the window at the top.</div>`;
    const vals = hist.map(h => lastCp(h.r, comb)?.values.count ?? 0), max = Math.max(...vals, 1), min = Math.min(...vals);
    let spark = "";
    if (hist.length > 1) {
      const sw = 820, sh = 54, sx = i => 24 + i * (sw - 48) / (hist.length - 1), sy = v => max === min ? sh / 2 : (sh - 12) - ((v - min) / (max - min)) * (sh - 24);
      spark = `<div style="padding:10px 16px;border-bottom:1px solid var(--border);background:#fdfbfb;display:flex;align-items:center;gap:16px"><div style="font-size:12px;color:var(--text-muted);white-space:nowrap">Record count trend · ${esc(winLabel().toLowerCase())}</div>
        <svg width="100%" viewBox="0 0 ${sw} ${sh}" style="max-height:54px;display:block"><polyline fill="none" stroke="#B50232" stroke-width="1.8" points="${hist.map((h, i) => `${sx(i).toFixed(1)},${sy(vals[i]).toFixed(1)}`).join(" ")}"/>
        ${hist.map((h, i) => { const selD = h.d === d, sft = STATUS[STATE.edition][ds.key][h.d]?.code === "control_break"; return `<circle cx="${sx(i).toFixed(1)}" cy="${sy(vals[i]).toFixed(1)}" r="${selD ? 4.5 : 3}" fill="${sft ? "#FF780F" : (selD ? "#B50232" : "#fff")}" stroke="${sft ? "#c2410c" : "#B50232"}" stroke-width="1.6" ${tipAttr(`<b>${h.d}</b><br>${fmt(vals[i])} rows`)}/>`; }).join("")}</svg></div>`;
    }
    return `${spark}<div class="table-wrap"><table><thead><tr><th>Info date / version</th><th style="width:220px">Relative volume</th><th class="num">Record count</th><th class="num">Sum of amount</th>${comb && ds.inEG ? '<th class="num">Run duration</th>' : ""}<th>Status</th></tr></thead><tbody>
      ${hist.slice().reverse().map(h => { const cur = h.d === d, s = h.d ? STATUS[STATE.edition][ds.key][h.d] : { code: "ok" }, lc = lastCp(h.r, comb), c = lc?.values.count ?? 0, pct = Math.max(8, Math.round(c / max * 100)), sft = s.code === "control_break";
        return `<tr class="row-link ${cur ? "row-selected" : ""}" data-go="${h.d ? "day:" + h.d : "sub:history"}" tabindex="0" title="Partitioning #${h.r.atum.pid}"><td style="font-weight:${cur ? 600 : 400}">${esc(h.d || h.r.version)} ${cur ? '<span style="color:var(--primary);font-size:11.5px;margin-left:6px">(Selected)</span>' : ""}</td>
          <td><div style="background:#e6e2e2;height:8px;border-radius:4px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${sft ? "#FF780F" : "#B50232"}"></div></div></td>
          <td class="num" style="font-weight:600">${fmt(lc?.values.count)}</td><td class="num">${fmt(lc?.values.sum_amount, true)}</td>${comb && ds.inEG ? `<td class="num">${h.r.eg ? dur(h.r.eg.end - h.r.eg.start) : "—"}</td>` : ""}<td>${stChip(s.code)}</td></tr>`; }).join("")}
      </tbody></table></div>`;
  }
};
// Batches of one dataset share all keys except the varying one (info_date); offer only those inside the window
function batchesInWindow(ds) {
  if (ds.static) return [];
  const comb = STATE.edition === "combined";
  return DAYS.filter(x => {
    const r = REC[ds.key][x];
    if (!r.expected || (!comb && !r.atum) || (comb && !(r.atum || r.eg))) return false;
    return inWin(x, comb ? recTime(r) : lastCp(r, false).t);
  }).reverse();
}
function viewLineage() {
  const comb = STATE.edition === "combined";
  if (!edDatasets().includes(byKey[STATE.focus])) STATE.focus = "cust_pay";
  const ds = byKey[STATE.focus], batches = batchesInWindow(ds);
  if (batches.length && !batches.includes(STATE.day)) STATE.day = batches[0];
  const d = STATE.day, r = recFor(ds.key, d), s = STATUS[STATE.edition][ds.key][d] || { code: "ok" };
  const tabs = Object.keys(SUBTABS);
  if (!tabs.includes(STATE.subtab)) STATE.subtab = "measures";
  const graph = lineageSvg(ds.key);
  const metrics = [...new Set(graph.nodes.flatMap(k => byKey[k].measures))];
  if (!metrics.includes(STATE.graphMetric)) STATE.graphMetric = metrics[0] || "count";
  const allKeys = batchKeys(ds, d, r);
  const shared = allKeys.filter(([k]) => k !== "info_date" && k !== "ref_version").map(([k, v]) => `${k}=${v}`).join(" · ");
  const varyKey = ds.static ? "ref_version" : "info_date";
  const pivotBtn = r.atum ? `<button class="link-chip" style="margin-left:auto" data-act="pivot" data-ds="${esc(ds.key)}" data-day="${esc(d || TODAY)}" data-drop="${esc(varyKey)}" title="Search all batches sharing these keys with ${varyKey}=null and exact-keys=true">Find all batches (vary ${varyKey})</button>` : "";
  const batchBar = ds.static
    ? `<div class="links-row"><span class="chip">Reference data</span> single current version <b style="color:var(--text)">ref_version = ${esc(STATIC_ISO.version)}</b> <span class="muted">· keys: <span class="mono-id">${esc(shared)}</span></span>${pivotBtn}</div>`
    : `<div class="links-row"><span ${tipAttr(TERM.tip + " All batches of a dataset share the same keys except info_date.")} style="border-bottom:1px dotted var(--text-muted);cursor:help">${TERM.One}</span>
        ${batches.length ? `<div class="control-pill" style="height:27px;font-size:12px;padding:0 8px"><select data-set="day">${batches.map(x => `<option value="${x}" ${x === d ? "selected" : ""}>info_date = ${x}${x === TODAY ? " (today)" : ""}</option>`).join("")}</select></div>
        <span>${batches.length} ${batches.length === 1 ? TERM.one : TERM.many} in ${esc(winLabel().toLowerCase())}</span>` : `<span>No ${TERM.many} in ${esc(winLabel().toLowerCase())}; showing info_date ${d}</span>`}
        <span class="muted">· shared keys: <span class="mono-id">${esc(shared)}</span></span>${pivotBtn}</div>`;
  const focusId = partitioningIdentity(ds, d, r, true);
  return `<section class="card"><div class="card-toolbar"><span class="toolbar-meta">${graph.nodes.length} nodes · ${graph.edges.length} edges · Highlighting active path for <code>${esc(focusId)}</code></span>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div class="control-pill" style="height:27px;font-size:12px;padding:0 8px"><span>Graph metric:</span><select data-set="graphMetric">${metrics.map(m => `<option value="${m}" ${STATE.graphMetric === m ? "selected" : ""}>${esc(MEASURES[m].label)}</option>`).join("")}</select></div>
        <div class="pill-group"><button class="pill-btn ${STATE.scope === "full" ? "active" : ""}" data-go="scope:full">Full graph</button><button class="pill-btn ${STATE.scope === "direct" ? "active" : ""}" data-go="scope:direct">Direct neighbors (1 hop)</button></div>
      </div></div>
      <div class="lineage-canvas">${graph.svg}</div></section>
    <section class="card" style="margin-bottom:0">
      <div class="inspector-head"><div class="inspector-title"><h2 style="font-family:var(--mono);font-size:14px">${esc(focusId)}</h2>${r.atum?.pid ? `<span class="mono-id">#${r.atum.pid}</span>` : ""}<span class="chip">author: <b>${esc(ds.author)}</b></span>${prodBadge(ds.producer)}${stChip(s.code)}</div>
        <div class="subtabs">${tabs.map(k => `<button class="subtab ${STATE.subtab === k ? "active" : ""}" data-go="sub:${k}">${SUBTABS[k]}</button>`).join("")}</div></div>
      ${batchBar}
      <div>${INSPECT[STATE.subtab](ds, d, r, s, graph)}</div></section>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════════════════════
const VIEWS = { datasets: viewDatasets, lineage: viewLineage };
function render() {
  renderShell();
  const out = VIEWS[STATE.view]();
  const extra = STATE.view === "datasets" ? datasetFilters() : "";
  $("view").innerHTML = pageHead(STATE.view) + filterBar(extra) + (typeof out === "string" ? out : out.html);
  if (out.after) out.after();
  tt.classList.add("hidden");
  syncUrl();
}
render();
</script>
</body>
</html>
