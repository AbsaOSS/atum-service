name: Build All Modules

on:
  pull_request:
    branches:
      - '**'
    types: [ opened, synchronize, reopened ]

jobs:
  test-agent-reader-and-model:
    name: Test Agent, Reader and Model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d

      - name: Setup Scala
        uses: olafurpg/setup-scala@32ffa16635ff8f19cc21ea253a987f0fdf29844c
        with:
          java-version: "adopt@1.8"

      # On Java 8 the Spark 4 rows of the agent are not loaded into the project matrix at all (they need
      # Java 17), so this job proves the Spark 3 line still builds and runs on its Java 8 baseline.
      - name: Build and run tests
        run: sbt testAllStandard

      - name: Generate documenation
        run: sbt doc

  test-agent-spark4:
    name: Test Agent (Spark 4)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d

      - name: Setup Scala
        # installs the sbt launcher (its bundled JDK is immediately overridden below)
        uses: olafurpg/setup-scala@32ffa16635ff8f19cc21ea253a987f0fdf29844c
        with:
          java-version: "adopt@1.8"

      - name: Setup Java 17
        # Spark 4 has a Java 17 baseline; on an older JDK the Spark 4 rows are not loaded at all.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and run tests
        run: sbt "project agent_spark4" testAllStandard

      - name: Generate documentation
        run: sbt "project agent_spark4" doc

  test-agent-spark3-java11:
    name: Test Agent (Spark 3, Java 11)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d

      - name: Setup Scala
        # installs the sbt launcher (its bundled JDK is immediately overridden below)
        uses: olafurpg/setup-scala@32ffa16635ff8f19cc21ea253a987f0fdf29844c
        with:
          java-version: "adopt@1.8"

      - name: Setup Java 11
        # Java 8 is only the minimum for the Spark 3 agent line; Java 11 is the recommended runtime
        # (see `Setup.recommendedJava`), so it needs its own blocking test job rather than relying on the
        # Java 8 job above or the JaCoCo job (which runs on Java 11 but with continue-on-error).
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build and run tests
        run: sbt testAgentSpark3

  test-database-and-server:
    name: Test Database and Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: atum_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d

      - name: Setup JDK 11
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '11'

      - name: Build and run unit tests
        run: sbt "project database" test "project server" test

      - name: Prepare testing database
        run: sbt flywayMigrate

      - name: Build and run integration tests
        run: sbt "project database" testIT "project server" testIT

      - name: Generate documentation
        run: sbt "project database" doc "project server" doc

  sbom-and-aquasec-manifest:
    name: SBOM and Aquasec Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Generate filesystem SBOM (Trivy)
        # Verifiable CycloneDX SBOM of the repository and its resolved dependencies. Trivy runs in local mode only:
        # it writes a file and does NOT upload or register anything in AquaSec. Kept as a CI artifact for audit.
        # Complements - does not replace - the AquaSec compliance step below.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: atum-service-sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atum-service-sbom
          path: atum-service-sbom.cyclonedx.json
          if-no-files-found: error

      - name: Aquasec Manifest Generation
        # Mandated org compliance step: reports a build manifest to AquaSec's supply-chain platform. This registers
        # data upstream in AquaSec, but doesn't produce a local SBOM - the Trivy step above covers the verifiable SBOM.
        run: |
          export BILLY_SERVER=https://billy.eu-1.codesec.aquasec.com
          curl -sLo install.sh download.codesec.aquasec.com/billy/install.sh
          curl -sLo install.sh.checksum https://github.com/argonsecurity/releases/releases/latest/download/install.sh.checksum
          if ! cat install.sh.checksum | sha256sum --check; then
          echo "install.sh checksum failed"
          exit 1
          fi
          BINDIR="." sh install.sh
          rm install.sh install.sh.checksum
          ./billy generate \
            --access-token "${{ secrets.GITHUB_TOKEN }}" \
            --aqua-key "${{ secrets.AQUA_KEY }}" \
            --aqua-secret "${{ secrets.AQUA_SECRET }}" \
            --cspm-url https://eu-1.api.cloudsploit.com \
            --artifact-path "${{ github.workspace }}/server/Dockerfile"
