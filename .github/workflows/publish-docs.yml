name: Publish docs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required — the action uploads a release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: AbsaOSS/knowledge-base/actions/publish-single-page-docs@v1
        with:
          docs: |
            - md: docs/user-guide.md
              title: Atum Service
              description: Records verifiable evidence that data stays complete and unchanged through Apache Spark pipelines, and tracks where every dataset came from.
              slug: atum-service
              icon: shield
              tags: [data-quality, spark, data-lineage]
